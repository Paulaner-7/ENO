name: CI

on:
  push:
    branches: [main, pre-release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.3
  # qtwebview: the anime player on Windows (WebView2) and macOS (WKWebView).
  QT_MODULES: qtwebengine qtwebview qtwebchannel qtpositioning qtimageformats qtpdf qtspeech qtmultimedia

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
            # aqtinstall cannot read the Windows 6.11 repository layout yet.
            qt: 6.10.3
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1-dev libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libmpv-dev

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The extension host (host/) and its tests.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt || env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCANCORE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      # A test that ends in an exception loses its buffered output; the log
      # file keeps what QTest wrote before it.
      - name: Failed tests' logs
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in scancore_tests scancore_extension_tests scancore_host_tests; do
            exe=$(find build -name "$t.exe" | head -1)
            [ -n "$exe" ] || continue
            echo "=== $t"
            "$exe" -o "$t.txt,txt" -v1 || true
            cat "$t.txt" || true
          done
